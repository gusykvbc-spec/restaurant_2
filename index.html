<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Dinner Restaurant Selection — Bangkok</title>
<style>
  :root {
    --gold: #f59e0b;
    --green: #10b981;
    --blue: #3b82f6;
    --purple: #8b5cf6;
    --red: #ef4444;
    --gray: #64748b;
    --bg: #f8fafc;
    --card: #ffffff;
    --border: #e2e8f0;
    --text: #1e293b;
    --muted: #64748b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
  .header { background: linear-gradient(135deg, #1e293b 0%, #334155 100%); color: white; padding: 48px 32px 40px; text-align: center; }
  .header h1 { font-size: 2rem; font-weight: 700; margin-bottom: 8px; }
  .header p { opacity: 0.8; font-size: 1rem; }
  .meta-pills { display: flex; justify-content: center; gap: 12px; margin-top: 20px; flex-wrap: wrap; }
  .pill { background: rgba(255,255,255,0.15); border-radius: 999px; padding: 4px 14px; font-size: 0.85rem; }
  .container { max-width: 1100px; margin: 0 auto; padding: 32px 20px; }
  .section-title { font-size: 1.25rem; font-weight: 700; margin-bottom: 20px; padding-bottom: 8px; border-bottom: 2px solid var(--border); color: var(--text); }

  .reviews-section-title { font-size:1.25rem; font-weight:700; margin:40px 0 20px; padding-bottom:8px; border-bottom:2px solid var(--border); }
  .update-badge { display:inline-block; background:#f0fdf4; border:1px solid #bbf7d0; color:#166534; border-radius:999px; padding:3px 12px; font-size:.78rem; font-weight:600; margin-left:12px; vertical-align:middle; }
  .rest-block { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:20px; margin-bottom:20px; }
  .rest-block-header { display:flex; align-items:center; gap:12px; margin-bottom:16px; padding-bottom:10px; border-bottom:1px solid var(--border); }
  .rest-block-rank { font-size:1.3rem; }
  .rest-block-name { flex:1; font-size:1rem; font-weight:700; }
  .rest-block-score { font-size:1rem; font-weight:800; color:var(--green); }
  .rv-card { border-left:3px solid var(--gold); padding:10px 14px; margin-bottom:9px; background:#fffbeb; border-radius:0 8px 8px 0; }
  .rv-card:last-child { margin-bottom:0; }
  .rv-header { display:flex; align-items:center; gap:8px; margin-bottom:3px; flex-wrap:wrap; }
  .rv-stars { color:var(--gold); font-size:.95rem; }
  .rv-meta { font-size:.76rem; color:var(--muted); }
  .rv-text { font-size:.87rem; font-style:italic; }

</style></head><body><p>Full report loading...</p></body></html>
