name: Update Reviews Hourly

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Scrape reviews
        run: python scrape_reviews.py
      - name: Generate HTML
        run: python generate_html.py
      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reviews.json index.html
          git diff --staged --quiet || git commit -m "Auto-update reviews $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
